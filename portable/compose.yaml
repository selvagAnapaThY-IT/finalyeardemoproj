services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fintaxpro
      POSTGRES_USER: fintaxpro
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fintaxpro]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/fintaxpro
      DATABASE_USER: fintaxpro
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 32 characters}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      ML_API_URL: ${ML_API_URL:-}
      ML_API_KEY: ${ML_API_KEY:-}
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [backend]
  ml:
    profiles: [ml]
    build: ./ml
    environment:
      ML_API_KEY: ${ML_API_KEY:?Set ML_API_KEY for the ML profile}
    volumes: [./ml/saved_models:/app/saved_models:ro]
volumes:
  postgres-data:
