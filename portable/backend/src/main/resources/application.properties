spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/fintaxpro}
spring.datasource.username=${DATABASE_USER:fintaxpro}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.error.include-message=never
server.servlet.session.cookie.same-site=strict
fintax.jwt-secret=${JWT_SECRET}
fintax.cookie-secure=${COOKIE_SECURE:true}
fintax.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
fintax.gemini-key=${GEMINI_API_KEY:}
fintax.gemini-model=${GEMINI_MODEL:}
fintax.ml-url=${ML_API_URL:}
fintax.ml-key=${ML_API_KEY:}
spring.jackson.deserialization.fail-on-unknown-properties=true
server.tomcat.max-http-form-post-size=100KB
